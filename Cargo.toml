[package]
name = "toolbox"
version = "0.1.1"
edition = "2024"

[dependencies]
webdav-backup = { path = "crates/webdav-backup" }
llm-proxy = { path = "crates/llm-proxy" }
clap = { version = "4.6", features = ["derive"] }
tokio = { version = "1.53", default-features = false, features = [
    "rt-multi-thread",
    "macros",
    "net",
] }
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "fmt",
] }

[workspace]
resolver = "3"

[profile.release]
strip = true
incremental = true
